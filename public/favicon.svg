    <!-- Row 3 -->
    <rect x="36" y="24" width="4" height="4" rx="0.5" />
    <rect x="41" y="24" width="4" height="4" rx="0.5" />
    <rect x="46" y="24" width="4" height="4" rx="0.5" />
